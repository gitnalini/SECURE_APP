databases:
  - name: securekey
    plan: free
    databaseName: securekey
    user: securekey

services:
  - type: keyvalue
    name: my-redis-cache
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: securekey
    runtime: python
    plan: free
    buildCommand: "pip install -r secureKey/requirements.txt && python secureKey/manage.py migrate"
    startCommand: "gunicorn --chdir secureKey securekey.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securekey
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: RABBITMQ_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: my-redis-cache
          property: connectionString